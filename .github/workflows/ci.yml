name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # also run before a release (see build.yml)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_QPA_PLATFORM: offscreen          # the tests build real Qt widgets without a display
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and release consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: Version / CHANGELOG consistency
        run: python scripts/check_version.py

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux, Python 3.9",    os: ubuntu-22.04,   python: "3.9" }
          - { name: "Linux, Python 3.10",   os: ubuntu-22.04,   python: "3.10" }
          - { name: "Linux, Python 3.12",   os: ubuntu-22.04,   python: "3.12", coverage: true }
          - { name: "Linux, Python 3.13",   os: ubuntu-22.04,   python: "3.13" }
          - { name: "Windows, Python 3.12", os: windows-latest, python: "3.12" }
          - { name: "macOS, Python 3.12",   os: macos-latest,   python: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux system packages (Qt offscreen libraries; OpenSSH for the sshd integration tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 openssh-server
      - run: pip install -r requirements-test.txt
      - name: Tests
        if: ${{ !matrix.coverage }}
        run: pytest -q
      - name: Tests with coverage
        if: ${{ matrix.coverage }}
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml

  selftest:
    name: Source launch self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -r requirements.txt
      - name: Build the whole GUI offscreen and exit
        run: python run.py --selftest

  hostile-dns:
    name: Tests under a stalling DNS resolver
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NETTRANSFER_HOSTILE_DNS: "1"      # every name lookup stalls; IP literals and localhost stay instant
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux system packages
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 openssh-server
      - run: pip install -r requirements-test.txt
      - name: Tests (a hidden DNS lookup on a hot path fails here instead of flaking on a slow runner)
        run: pytest -q --timeout=60

  container:
    name: CLI container image
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t nettransfer-cli .
      - name: Smoke test
        run: |
          docker run --rm nettransfer-cli --version
          docker run --rm -v "$PWD:/data" nettransfer-cli hash /data/LICENSE
          docker run --rm nettransfer-cli interfaces

  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, selftest, hostile-dns, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
