# Builds the single-file executables natively on Windows, macOS (Apple Silicon + Intel) and Linux and,
# for a tag like v2.0.0, publishes a GitHub Release with checksums and build-provenance attestations.
# PyInstaller cannot cross-compile, hence one runner per target. See docs/RELEASING.md.
name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:                       # dry-run the packaging only when something it depends on changes
      - "packaging/**"
      - "assets/**"
      - "app/**"
      - "run.py"
      - "requirements*.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: Tag matches version and CHANGELOG
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify version
        env:
          TAG_REF: ${{ github.ref_name }}
        run: python scripts/check_version.py "${TAG_REF}"

  ci:
    name: Full test suite
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.label }})
    needs: [verify, ci]
    # run when the gates passed *or were skipped* (pull requests skip them; ci.yml already tests PRs)
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: ubuntu-22.04,   label: linux-x86_64 }   # oldest LTS runner: the binary then also runs on newer glibc
          - { os: macos-latest,   label: macos-arm64 }    # Apple Silicon
          - { os: macos-15-intel, label: macos-x86_64 }   # Intel
    env:
      # Optional signing. Without these secrets the build still works and produces unsigned binaries.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux packages needed at build time (bundled into the executable)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
          libdbus-1-3 libfontconfig1
      - run: pip install -r requirements-dev.txt

      - name: macOS - import the Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          echo "CODESIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"   # picked up by packaging/nettransfer.spec

      - name: Build and smoke-test (CLI --version/hash, GUI --selftest)
        run: python packaging/build.py --stage build

      - name: Windows - sign the executables
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($f in 'dist\NetTransfer.exe', 'dist\nettransfer-cli.exe') {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item $pfx

      - name: macOS - notarize and staple
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != ''
        run: |
          ditto -c -k --keepParent dist/NetTransfer.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/NetTransfer.app

      - name: Archive and checksum
        run: python packaging/build.py --stage collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nettransfer-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # create the release
      id-token: write          # build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: nettransfer-*
          merge-multiple: true
      - name: One SHA256SUMS.txt for the release and the release notes from CHANGELOG.md
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cat artifacts/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          rm artifacts/SHA256SUMS-*.txt
          python scripts/extract_changelog.py "${REF_NAME}" > release-notes.md
          ls -l artifacts
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "artifacts/*"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: |
            artifacts/*
            SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
