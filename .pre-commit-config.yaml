# pip install pre-commit && pre-commit install      (runs on every commit; CI runs the same checks)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-version
        name: check version and changelog consistency
        entry: python3 scripts/check_version.py
        language: system
        pass_filenames: false
        files: ^(app/__init__\.py|CHANGELOG\.md)$
